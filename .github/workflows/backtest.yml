name: SwingFinder Backtest

on:
  workflow_dispatch:
    inputs:
      run_dir:
        description: "Which runs/ folder to execute"
        required: true
        type: choice
        options:
          - "2026-08-25_HAL-MO-EBAY_pullback-reversal_1Day"
          - "2026-08-25_watchlist20_pullback-reversal_1Day"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Alpaca CLI
        run: |
          set -eo pipefail
          go install github.com/alpacahq/cli/cmd/alpaca@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check Alpaca auth
        # Informational only, not gating: `alpaca doctor` also checks the Trading API,
        # which this backtest never calls (it only fetches historical bars via the
        # Data API) -- this project's ALPACA_API_KEY/SECRET authenticate the Data API
        # fine but 401 against the Trading API (confirmed live in run #1 of this
        # workflow: "data API: connected", "trading API: ... 401"), which would
        # otherwise fail this step on something irrelevant to what this job does. The
        # real, meaningful check is the "Fetch historical bars" step below actually
        # succeeding.
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_QUIET: "1"
        run: alpaca doctor

      - name: Fetch historical bars
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_QUIET: "1"
        run: |
          set -eo pipefail
          cd "runs/${{ inputs.run_dir }}"
          mkdir -p raw normalized

          START=$(jq -r '.start' config.json)
          END=$(jq -r '.end' config.json)
          TIMEFRAME=$(jq -r '.timeframe' config.json)
          FEED=$(jq -r '.feed' config.json)
          ADJUSTMENT=$(jq -r '.adjustment' config.json)

          # alpaca data bars pages at 1000 bars/request by default -- confirmed live
          # (run #3 of this workflow silently truncated to page 1's 1000 bars,
          # 2020-07 to 2024-07, instead of the full requested 2016-2026 range) that a
          # single un-paginated call is not enough for a multi-year daily-bar fetch.
          # Loops on next_page_token, merging all pages' bars into one array, with a
          # hard cap (should never be hit for a ~10 year daily-bar range) so a runaway
          # token chain fails loudly instead of looping forever.
          MAX_PAGES=20
          for SYMBOL in $(jq -r '.symbols[]' config.json); do
            echo "Fetching $SYMBOL ($START to $END, $TIMEFRAME, feed=$FEED, adjustment=$ADJUSTMENT)"
            : > "raw/_pages_${SYMBOL}.jsonl"
            PAGE_TOKEN=""
            for i in $(seq 1 $MAX_PAGES); do
              if [ -z "$PAGE_TOKEN" ]; then
                alpaca data bars --symbol "$SYMBOL" --start "$START" --end "$END" \
                  --timeframe "$TIMEFRAME" --feed "$FEED" --adjustment "$ADJUSTMENT" \
                  --limit 10000 --quiet > "raw/_page_${SYMBOL}.json"
              else
                alpaca data bars --symbol "$SYMBOL" --start "$START" --end "$END" \
                  --timeframe "$TIMEFRAME" --feed "$FEED" --adjustment "$ADJUSTMENT" \
                  --limit 10000 --page-token "$PAGE_TOKEN" --quiet > "raw/_page_${SYMBOL}.json"
              fi
              cat "raw/_page_${SYMBOL}.json" >> "raw/_pages_${SYMBOL}.jsonl"
              PAGE_TOKEN=$(jq -r '.next_page_token // empty' "raw/_page_${SYMBOL}.json")
              [ -z "$PAGE_TOKEN" ] && break
              if [ "$i" -eq "$MAX_PAGES" ]; then
                echo "::error::$SYMBOL still has a next_page_token after $MAX_PAGES pages -- aborting rather than looping forever"
                exit 1
              fi
            done
            jq -s '[.[].bars[]]' "raw/_pages_${SYMBOL}.jsonl" > "raw/bars_${SYMBOL}.json"
            rm -f "raw/_pages_${SYMBOL}.jsonl" "raw/_page_${SYMBOL}.json"
            echo "  -> $(jq 'length' "raw/bars_${SYMBOL}.json") total bars"
          done

      - name: Run backtest
        run: |
          set -eo pipefail
          cd "runs/${{ inputs.run_dir }}"
          python run.py

      - name: Commit results
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "runs/${{ inputs.run_dir }}/"
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "Backtest results: ${{ inputs.run_dir }} ($(date -u +%Y-%m-%d\ %H:%M)Z)"
          git push
