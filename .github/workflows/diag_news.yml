name: Diagnose news fetch (temporary)

# Temporary: measures the Decision Agent payload with headline-only news included. Runs the
# pipeline up to (not including) the model call — no Anthropic, no picks logged, no commits.
on:
  push:
    branches: [ccr-0a52a48a-g743mw]
    paths:
      - .github/workflows/diag_news.yml

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest && python -m pytest -q tests
      - name: Restore Webull auth token
        env:
          WEBULL_TOKEN_CONTENT_B64: ${{ secrets.WEBULL_TOKEN_CONTENT }}
        run: |
          mkdir -p webull_token
          echo "$WEBULL_TOKEN_CONTENT_B64" | base64 -d > webull_token/token.txt
      - name: Build Decision Agent payload (no model call)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          WEBULL_APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
          WEBULL_REGION_ID: us
          WEBULL_ENVIRONMENT: prod
          WEBULL_TOKEN_DIR: ${{ github.workspace }}/webull_token
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -eo pipefail
          cp pick_outcomes.csv /tmp/pick_outcomes.csv
          python -c "import sys, pipeline; pipeline.PICK_OUTCOMES_LOG_PATH='/tmp/pick_outcomes.csv'; sys.argv=['pipeline.py','--limit','2000','--save-decision-input','payload.json']; pipeline.main()" 2>&1 | grep -v "webull.core" | tail -20
          python - <<'PY'
          import json
          raw = open("payload.json").read(); d = json.loads(raw)
          print(f"payload chars: {len(raw):,}  (~{len(raw)//4:,} tokens est.)")
          news_chars = sum(len(json.dumps(r.get("News") or [])) for r in d["shortlist"])
          print(f"news chars: {news_chars:,}")
          for r in d["shortlist"]:
              print(f"{r['Ticker']:6s} news items: {len(r.get('News') or []):3d}")
          PY
