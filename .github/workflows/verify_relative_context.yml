name: Verify relative-context run (temporary)

# Temporary verification for the 52-week / sector-strength / open-order-pagination change.
# Full live pipeline run, but the pick log goes to a throwaway copy and NOTHING is committed
# (no results/, no pick_outcomes.csv). Output is uploaded as an artifact and printed.
# Push-triggered because workflow_dispatch only works for workflows on the default branch.
# Delete this file once verified.
on:
  push:
    branches: [ccr-0a52a48a-g743mw]
    paths:
      - .github/workflows/verify_relative_context.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest && pip show webull-openapi-python-sdk | head -2

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Restore Webull auth token
        env:
          WEBULL_TOKEN_CONTENT_B64: ${{ secrets.WEBULL_TOKEN_CONTENT }}
        run: |
          set -eo pipefail
          mkdir -p webull_token
          echo "$WEBULL_TOKEN_CONTENT_B64" | base64 -d > webull_token/token.txt

      - name: Full pipeline run (pick log redirected, nothing committed)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          WEBULL_APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
          WEBULL_REGION_ID: us
          WEBULL_ENVIRONMENT: prod
          WEBULL_TOKEN_DIR: ${{ github.workspace }}/webull_token
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -eo pipefail
          cp pick_outcomes.csv /tmp/pick_outcomes.csv
          python -c "import sys, pipeline; pipeline.PICK_OUTCOMES_LOG_PATH='/tmp/pick_outcomes.csv'; sys.argv=['pipeline.py','--limit','2000']; pipeline.main()" > verify_output.json
          python - <<'EOF'
          import json
          d = json.load(open("verify_output.json"))
          dec = d.get("decision") or {}
          print("=== HEADER ===")
          print(json.dumps({k: d.get(k) for k in ("market_bias", "vix", "market_gate_open",
                "pick_track_record", "sector_capped_out_count", "earnings_excluded_count")}, default=str))
          print("SECTOR", json.dumps({s: [v["label"], v["rs_20d_pp"], v["rs_5d_pp"]] for s, v in (d.get("sector_strength") or {}).items()}))
          print("SUMMARY", dec.get("overall_recommendation"))
          keys = ("ticker", "entry", "stop", "target", "rr_ratio", "news_sentiment", "catalyst_status",
                  "catalyst_date", "support_status", "setup_type", "exit_mode", "days_to_cover",
                  "short_percent_of_float", "short_interest_change_pct", "insider_purchase_count",
                  "insider_sale_count", "insider_net_value", "sector_etf", "sector_strength",
                  "sector_rs_20d_pp", "sector_rs_5d_pp", "pct_from_52w_high", "range_52w_position", "flags")
          for i, p in enumerate(dec.get("ranked_picks") or [], 1):
              print(f"=== PICK {i} ===")
              print("FIELDS", json.dumps({k: p.get(k) for k in keys}, default=str))
              for k in ("research_highlight", "rationale", "bear_case"):
                  print(k.upper(), p.get(k))
          print("=== EXCLUDED ===")
          for x in dec.get("excluded") or []:
              print("EXCL", json.dumps(x, default=str))
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-output
          path: verify_output.json
